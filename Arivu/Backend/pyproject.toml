[project]
name = "arivu-backend"
version = "0.1.0"
description = "Multi-project RAG backend with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.18",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.21,<1",
    "greenlet>=3.0",
    "chromadb>=0.6,<1",
    "sentence-transformers>=3.3,<4",
    "openai>=1.59,<2",
    "httpx>=0.28,<1",
    "pymupdf>=1.25,<2",
    "structlog>=24.4,<25",
    "tiktoken>=0.8,<1",
    "scikit-learn>=1.3,<2",
    "umap-learn>=0.5,<1",
    "pytest-asyncio>=0.25,<1",
    # LangChain ecosystem
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<1",
    "langchain-chroma>=0.1,<1",
    "langchain-openai>=0.2,<1",
    "langchain-ollama>=0.2,<1",
    # Universal document loaders
    "unstructured>=0.12,<1",
    "python-pptx>=0.6.23,<1",
    "openpyxl>=3.1.2,<4",
    "python-docx>=1.1.0,<2",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
